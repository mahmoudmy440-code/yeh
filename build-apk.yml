name: Build Raddad Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle and build Debug APK
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          cd RaddadAndroid
          gradle wrapper --gradle-version 8.5 --distribution-type bin || true
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaddadAndroid-Orders-AI-v3
          path: RaddadAndroid/app/build/outputs/apk/debug/app-debug.apk